:root{
  --font-display:'Segoe UI Variable','Segoe UI',system-ui,sans-serif;
  --font-body:'Segoe UI Variable','Segoe UI',system-ui,sans-serif;
  --font-mono:'Cascadia Mono','Cascadia Code',Consolas,ui-monospace,monospace;
  --font-glyph:'Segoe UI Symbol','Segoe UI Emoji',system-ui,sans-serif;
  --z-base:0;--z-sticky:10;--z-overlay:100;--z-toast:300;
  --dur-fast:.12s;--dur-med:.2s;
}
[data-theme="dark"]{
  --bg:#08080a;--bg-alt:#0d0d10;--line:#232326;--line-soft:#18181b;
  --fg:#f2f2f0;--fg-dim:#8c8c90;--fg-dimmer:#4c4c50;
}
[data-theme="light"]{
  --bg:#f4f4f2;--bg-alt:#ffffff;--line:#c9c9c4;--line-soft:#e2e2de;
  --fg:#111113;--fg-dim:#5a5a5f;--fg-dimmer:#8a8a8f;
}
html,body{box-sizing:border-box;margin:0;padding:0;width:100%;height:100%;overflow:hidden}
*,*::before,*::after{box-sizing:border-box;border-radius:8px}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
input:focus,select:focus{outline:none;border-color:var(--fg)}

.qr-titlebar{display:flex;align-items:center;gap:9px;padding:13px 14px 11px;border-bottom:1px solid var(--line-soft);background:var(--bg-alt);flex:none}
.qr-logo{display:flex;align-items:center;gap:8px;background:transparent;border:none;padding:0;cursor:pointer;color:var(--fg)}
.qr-logo-mark{height:15px;width:auto;max-width:40px;object-fit:contain;display:block}
[data-theme="light"] .qr-logo-mark{filter:invert(1)}
.qr-wordmark{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:-.01em}
.qr-version{font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);padding:2px 5px;border:1px solid var(--line-soft)}
.qr-btn{font:11px/1 inherit;color:var(--fg-dim);background:var(--bg-alt);border:1px solid var(--line-soft);padding:6px 9px;cursor:pointer}
.qr-btn:hover{background:#f2f2f014;border-color:var(--line)}
.qr-titlebar-spacer{flex:1}
.qr-lang-select{font:11px/1 inherit;color:var(--fg-dim);background:var(--bg-alt);border:1px solid var(--line-soft);padding:6px 7px;cursor:pointer}

#qr-panel{flex:1;min-height:0;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:14px}
#qr-panel::-webkit-scrollbar{width:8px}
#qr-panel::-webkit-scrollbar-thumb{background:var(--line)}
#qr-panel::-webkit-scrollbar-track{background:transparent}

.qr-section-title{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.qr-section-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-dim)}
.qr-section-rule{flex:1;height:1px;background:var(--line-soft)}

/* Capped + independently scrollable: QUICK_LIST can hold a dozen-plus
   stretched-res presets, far more than the reference mockup's 6 assumed.
   Without its own scroll box this grid alone can push Custom
   Resolution/Hotkey/etc. below the fold of the whole (already scrollable)
   #qr-panel, making them unreachable without an extra, non-obvious scroll. */
.qr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:7px;max-height:186px;overflow-y:auto;padding-right:2px}
.qr-grid::-webkit-scrollbar{width:6px}
.qr-grid::-webkit-scrollbar-thumb{background:var(--line)}
.qr-grid::-webkit-scrollbar-track{background:transparent}
.qr-res-preset{display:grid;gap:3px;text-align:left;background:var(--bg-alt);border:1px solid var(--line-soft);padding:9px 10px;cursor:pointer;color:var(--fg);transition:border-color var(--dur-fast),background var(--dur-fast)}
.qr-res-preset:hover{border-color:var(--fg);background:#f2f2f014}
.qr-res-preset-value{font-family:var(--font-mono);font-size:14px;font-weight:500;display:block}
.qr-res-preset-meta{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-dim);display:block}
.qr-res-preset-native{border-color:var(--fg)}
.qr-res-preset-native .qr-res-preset-meta{color:var(--fg);font-weight:500}

.qr-row{display:flex;gap:7px;align-items:center}
.qr-input{flex:1;min-width:0;font-family:var(--font-mono);font-size:13px;color:var(--fg);background:var(--bg-alt);border:1px solid var(--line-soft);padding:9px 10px}
select.qr-input{cursor:pointer}
.qr-btn-solid{font:600 12px/1 var(--font-display);color:var(--bg);background:var(--fg);border:none;padding:0 14px;cursor:pointer;height:34px;flex:none}
.qr-btn-solid:hover{background:#d8d8d5}

.qr-hotkey{background:var(--bg-alt);border:1px solid var(--line-soft);padding:12px;display:flex;flex-direction:column;gap:10px}
.qr-hotkey-state{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-dim)}
.qr-hotkey-state-on{color:var(--fg);font-weight:500}
.qr-hotkey-select{flex:0 0 92px}
.qr-hotkey-run{flex:1;font:600 12.5px/1 var(--font-display);padding:9px 0;cursor:pointer;border:1px solid transparent;background:var(--fg);color:var(--bg)}
.qr-hotkey-run:hover{background:#d8d8d5}
.qr-hotkey-run-stop{font-family:var(--font-display);background:transparent;color:var(--fg);border:1px solid var(--fg);font-weight:700}
.qr-hotkey-grid{display:grid;grid-template-columns:64px 1fr;gap:7px;align-items:center}
.qr-hotkey-grid label{font-size:11.5px;color:var(--fg-dim)}

<script>
/* ==S1 STATE== */
const S = {
  theme: 'dark',
  version: '',
  language: { setting: 'auto', resolved: 'en', options: { auto: 'Auto', en: 'English' } },
  strings: {},
  currentResolution: null,
  presets: [],
  resolutionQuery: '',
  uiPreferences: { collapsed_sections: [], favorite_resolutions: [] },
  hotkeyDraft: null,
  hotkey: { key: 'F6', native_res: '', stretched_res: '', running: false },
  monitors: [],
  pending: { outcomes: [], force_unlockable: false },
  faq: [],
  guardRemainingS: null,
  modal: null,
  updateInfo: null,
  updateStatus: { stage: 'idle', downloaded_bytes: 0, total_bytes: null, error: null },
};

let countdownTimer = null;
let guardPollTimer = null;
// bridge.py can keep retrying the auto-revert (a missed/unanswered UAC
// prompt) for a while after the local countdown reaches 0 -- this is how
// often the poller re-checks recheck_pending while that retry is ongoing.
const GUARD_POLL_MS = 4000;

let hotkeyPollTimer = null;
let hotkeyPollGeneration = 0;
// The hotkey listener thread can die on its own (e.g. a GetMessageW
// failure) with no automatic restart and nothing but a quickres.log trace
// -- state.hotkey.running only ever changes from an explicit
// start_hotkey/stop_hotkey response otherwise. This is how often the
// poller re-checks the listener's real liveness while the UI believes a
// hotkey is running.
const HOTKEY_POLL_MS = 5000;

// EnumDisplaySettingsW is a cheap local OS read. Polling it at a restrained
// cadence keeps the active preset tied to the real desktop mode even when a
// game, Windows Settings, or another tool changed the resolution.
let resolutionPollTimer = null;
let resolutionPollInFlight = false;
const RESOLUTION_POLL_MS = 2000;
const CALL_QUIET = {};

let updatePollTimer = null;
let updateInstallStarted = false;
let updatePollInFlight = false;
const UPDATE_POLL_MS = 250;

/* ==S2 CALL== */
async function call(name, ...args) {
  const quiet = args[0] === CALL_QUIET;
  if (quiet) args.shift();
  let r;
  try { r = await window.pywebview.api[name](...args); }
  catch (e) {
    if (!quiet) pushStatus('err', (e && e.message) || String(e));
    return null;
  }
  if (!r || r.ok !== true) {
    if (!quiet) pushStatus(r && r.kind === 'busy' ? 'idle' : 'err', (r && r.message) || 'Unexpected failure');
    return null;
  }
  return r.data;
}

/* ==S3 TOAST== */
const TOAST_MS = { ok: 4000, idle: 4000, err: 8000 };
const MAX_TOASTS = 3;
const TOAST_GLYPH = { ok: '✓', err: '×', idle: '·' };

function pushStatus(kind, message, opts) {
  opts = opts || {};
  const host = document.getElementById('qr-toast-host');
  const toast = document.createElement('div');
  toast.className = 'qr-toast qr-toast-' + kind;
  const g = document.createElement('span');
  g.className = 'qr-toast-glyph';
  g.textContent = TOAST_GLYPH[kind] || TOAST_GLYPH.idle;
  const m = document.createElement('span');
  m.className = 'qr-toast-msg';
  m.textContent = message;
  toast.appendChild(g);
  toast.appendChild(m);
  host.appendChild(toast);
  while (host.children.length > MAX_TOASTS) {
    host.removeChild(host.firstElementChild);
  }
  if (!opts.persist) {
    const ms = TOAST_MS[kind] || TOAST_MS.idle;
    setTimeout(function () {
      if (toast.parentNode === host) host.removeChild(toast);
    }, ms);
  }
}

/* ==S4 DOM== */
function el(id) { return document.getElementById(id); }
function cls(node, base, variant) { node.className = variant ? base + ' ' + variant : base; }

/* ==S5 RENDER== */
function renderTitlebar(state) {
  document.documentElement.setAttribute('data-theme', state.theme);
  el('qr-theme-toggle').textContent = state.theme === 'dark' ? state.strings.theme_light : state.strings.theme_dark;
  el('qr-version').textContent = state.version ? 'v' + state.version : '';
}

function renderLangSelect(state) {
  const select = el('qr-lang-select');
  select.innerHTML = '';
  Object.keys(state.language.options).forEach(function (code) {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = state.language.options[code];
    if (code === state.language.setting) opt.selected = true;
    select.appendChild(opt);
  });
}

/* Static chrome labels translated server-side (S.strings, from
   get_initial_state/set_language) mapped onto their DOM ids. */
const STRING_TARGETS = {
  'qr-str-quick-res': 'quick_resolutions_label',
  'qr-str-custom-res': 'custom_resolution_label',
  'qr-str-hotkey-toggle': 'hotkey_toggle_label',
  'qr-str-native': 'native_label',
  'qr-str-stretched': 'stretched_label',
  'qr-str-notice-title': 'notice_title',
  'qr-open-faq': 'btn_faq',
  'qr-open-monitors': 'btn_monitors',
  'qr-check-updates': 'btn_updates',
  'qr-str-boot-error-title': 'boot_error_title',
  'qr-str-boot-error-text': 'boot_error_body',
  'qr-boot-retry': 'btn_retry',
};

function renderStrings(state) {
  const s = state.strings;
  Object.keys(STRING_TARGETS).forEach(function (id) {
    const key = STRING_TARGETS[id];
    if (!key || !s[key]) return;
    const node = el(id);
    if (node) node.textContent = s[key];
  });
  el('qr-custom-input').placeholder = s.custom_res_placeholder || 'e.g. 1440x1080';
  el('qr-custom-apply').textContent = s.btn_apply || 'Apply';
  renderHotkeySection(state);
}

function uiText(state, en, ru) {
  return state.language.resolved === 'ru' ? ru : en;
}

function preferencesFor(state) {
  return state.uiPreferences || { collapsed_sections: [], favorite_resolutions: [] };
}

let uiSaveQueue = Promise.resolve();
function saveUiPreferences() {
  const snapshot = JSON.parse(JSON.stringify(S.uiPreferences));
  uiSaveQueue = uiSaveQueue.then(function () { return call('set_ui_preferences', snapshot); });
  return uiSaveQueue;
}

function renderSectionStates(state) {
  const collapsed = preferencesFor(state).collapsed_sections;
  ['quick', 'custom', 'hotkey'].forEach(function (section) {
    const open = !collapsed.includes(section);
    el('qr-toggle-' + section).setAttribute('aria-expanded', String(open));
    el('qr-body-' + section).hidden = !open;
  });
  el('qr-search-label').textContent = uiText(state, 'Search resolutions', 'Поиск разрешений');
}

function presetMatches(preset, query) {
  const q = query.trim().toLowerCase().replace(/\s/g, '').replace(/×/g, 'x');
  if (!q) return true;
  if (q.includes(':')) {
    const ratio = /^(\d+(?:\.\d+)?):(\d+(?:\.\d+)?)$/.exec(q);
    return !!ratio && Number(ratio[2]) > 0
      && Math.abs(preset.width / preset.height - Number(ratio[1]) / Number(ratio[2])) < 0.01;
  }
  if (q.includes('x')) return (preset.width + 'x' + preset.height).includes(q);
  return String(preset.width).includes(q) || String(preset.height).includes(q);
}

function renderPresetCards(state) {
  const s = state.strings;
  const presetList = el('qr-res-presets');
  const focused = document.activeElement;
  const scrollTop = presetList.scrollTop;
  presetList.innerHTML = '';
  const favorites = preferencesFor(state).favorite_resolutions;
  const visible = state.presets.filter(function (p) { return presetMatches(p, state.resolutionQuery || ''); });
  visible.sort(function (a, b) {
    return Number(favorites.includes(b.width + 'x' + b.height)) - Number(favorites.includes(a.width + 'x' + a.height));
  });
  const focusKey = focused && focused.dataset && focused.dataset.resolution;
  let restoreFocus = null;
  visible.forEach(function (p) {

    cls(btn, 'qr-res-preset', isCurrent ? 'qr-res-preset-native' : '');
    const value = document.createElement('span');
    value.className = 'qr-res-preset-value';
    value.textContent = p.width + 'x' + p.height;

    meta.className = 'qr-res-preset-meta';

    meta.textContent = kindLabel + ' · ' + p.aspect_ratio;
    btn.appendChild(value);
    btn.appendChild(meta);

    const favorite = document.createElement('button');
    favorite.type = 'button';
    favorite.className = 'qr-favorite';

    favorite.dataset.resolution = resolution;

    favorite.title = uiText(state, 'Favorite ', 'В избранное: ') + resolution;
    item.appendChild(btn);
    item.appendChild(favorite);
    presetList.appendChild(item);
    if (resolution === focusKey) restoreFocus = focused.dataset.favorite ? favorite : btn;
  });
  el('qr-search-empty').hidden = visible.length > 0;
  el('qr-search-empty').textContent = visible.length ? '' : uiText(state, 'No matching resolutions', 'Разрешения не найдены');
  presetList.scrollTop = scrollTop;
  if (restoreFocus && restoreFocus.focus) restoreFocus.focus({ preventScroll: true });
}

function renderResSection(state) {
  renderPresetCards(state);

  const nativeSelect = el('qr-hotkey-native');
  const stretchedSelect = el('qr-hotkey-stretched');
  const prevNative = nativeSelect.value;
  const prevStretched = stretchedSelect.value;
  nativeSelect.innerHTML = '';
  stretchedSelect.innerHTML = '';
  const seen = {};
  state.presets.forEach(function (p) {
    const value = p.width + 'x' + p.height;
    if (seen[value]) return;
    seen[value] = true;
    const optA = document.createElement('option');
    optA.value = value;
    optA.textContent = value;
    nativeSelect.appendChild(optA);
    const optB = optA.cloneNode(true);
    stretchedSelect.appendChild(optB);
  });
  // A saved hotkey profile can legitimately reference a resolution that is
  // no longer in QUICK_LIST (for example after a monitor change). Keep that
  // value selectable instead of rendering an empty select and silently
  // replacing the user's stored configuration.
  [state.hotkey.native_res, state.hotkey.stretched_res].forEach(function (value) {
    if (!value || seen[value]) return;
    seen[value] = true;
    const optA = document.createElement('option');
    optA.value = value;
    optA.textContent = value;
    nativeSelect.appendChild(optA);
    stretchedSelect.appendChild(optA.cloneNode(true));
  });
  if (prevNative && seen[prevNative]) nativeSelect.value = prevNative;
  if (prevStretched && seen[prevStretched]) stretchedSelect.value = prevStretched;

/* ==S6 MODALS== */
function stopCountdown() {
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
}

function displayGuardRemainingS(value) {
  // The bridge intentionally returns the precise fractional time remaining,
  // but a countdown is user-facing whole seconds.  Rounding up avoids
  // showing "0s" before the guard expires; clamping also prevents the final
  // local tick from ever rendering a negative fraction such as "-0.23s".
  const seconds = Number(value);
  return Number.isFinite(seconds) ? Math.max(0, Math.ceil(seconds)) : null;
}

function stopGuardPolling() {
  if (guardPollTimer) { clearInterval(guardPollTimer); guardPollTimer = null; }
}

// A guard is only actually resolved once the server confirms it either
// way -- outcomes drained (confirmed/reverted and cleared from the
// on-disk record) or force-unlockable (retries exhausted, UNCONFIRMABLE).
// While an outcome is still IN_FLIGHT (bridge.py mid-retry), neither is
// true yet, so polling must keep going rather than stopping after one look.
function guardStillUnresolved() {
  return (S.pending.outcomes || []).length > 0 && !S.pending.force_unlockable;
}

function pendingTargetKey(outcomes) {
  // A successful auto-revert removes its target from the pending record.
  // Compare only stable ids (not elapsed time/messages) so the UI re-reads
  // physical monitor state on a real resolution, without enumerating
  // devices on every background guard-poll tick.
  return (outcomes || []).map(function (outcome) {
    return String(outcome.instance_id || '');
  }).sort().join('\u001f');
}

async function pollGuardOnce() {
  const d = await call('recheck_pending');
  if (d) {
    const targetsBefore = pendingTargetKey(S.pending.outcomes);
    const outcomes = d.outcomes || [];
    S.pending = { outcomes: outcomes, force_unlockable: d.force_unlockable };
    S.guardRemainingS = displayGuardRemainingS(d.guard_remaining_s);
    if (targetsBefore !== pendingTargetKey(outcomes)) {
      const monitors = await call('list_monitors');
      if (monitors) S.monitors = monitors;
    }
    renderNoticeSection(S);
    renderMonitorsModal();
  }
  if (!guardStillUnresolved()) stopGuardPolling();
}

// The local countdown alone freezes at "0s" once it hits zero -- it never
// knows whether bridge.py's auto-revert actually finished (its retries,
// each gated on a missed/unanswered UAC prompt, can keep the guard
// unresolved for well past the 10s the countdown displays). This keeps
// re-checking the server on a cadence for as long as the guard stays
// unresolved, so the notice card (and its Force Unlock button, once the
// server actually supports it) updates itself instead of requiring the
// user to close and reopen the modal.
function startGuardPolling() {
  stopGuardPolling();
  if (!guardStillUnresolved()) return;
  guardPollTimer = setInterval(pollGuardOnce, GUARD_POLL_MS);
}

function stopHotkeyPolling() {
  hotkeyPollGeneration += 1;
  if (hotkeyPollTimer) { clearInterval(hotkeyPollTimer); hotkeyPollTimer = null; }
}

// Mirrors startGuardPolling()/pollGuardOnce() above: the client needs to
// notice a server-side state change (the listener thread dying on its own)
// that no explicit user action triggers. Only polls while the UI actually
// believes a hotkey is running -- a user-initiated stop_hotkey clears the
// interval immediately instead of waiting for the next tick.
function startHotkeyPolling() {
  stopHotkeyPolling();
  if (!S.hotkey.running && !S.hotkey.restore_pending) return;
  hotkeyPollTimer = setInterval(pollHotkeyOnce, HOTKEY_POLL_MS);
}

function resolutionKey(resolution) {
  return resolution ? resolution.width + 'x' + resolution.height : '';
}

function resolutionStateChanged(next) {
  if (!next || !Array.isArray(next.presets)) return false;
  if (resolutionKey(S.currentResolution) !== resolutionKey(next.current_resolution)) return true;
  if (S.presets.length !== next.presets.length) return true;
  return S.presets.some(function (preset, index) {
    const updated = next.presets[index];
    return !updated
      || preset.width !== updated.width
      || preset.height !== updated.height
      || preset.kind !== updated.kind
      || preset.aspect_ratio !== updated.aspect_ratio;
  });
}

async function refreshResolutionState() {
  if (resolutionPollInFlight || document.hidden || !window.pywebview) return;
  resolutionPollInFlight = true;
  try {
    // Passive refreshes stay silent: a transient display-topology change
    // should never produce a toast every two seconds.
    const next = await call('get_resolution_state', CALL_QUIET);
    if (!resolutionStateChanged(next)) return;
    S.currentResolution = next.current_resolution;
    S.presets = next.presets;
    // Deliberately redraw only the cards. Re-rendering the whole resolution
    // section would reset an open hotkey select while this background check
    // is merely moving an active outline.
    renderPresetCards(S);
  } catch (_) {
    // Windows can be between display modes for a moment; the next quiet poll
    // will try again without disrupting the user.
  } finally {
    resolutionPollInFlight = false;
  }
}

function startResolutionPolling() {
  if (resolutionPollTimer !== null) return;
  resolutionPollTimer = setInterval(refreshResolutionState, RESOLUTION_POLL_MS);
}

async function pollHotkeyOnce() {
  const generation = hotkeyPollGeneration;
  const d = await call('get_hotkey_status');
  if (generation !== hotkeyPollGeneration) return;
  if (d) {
    const stoppedUnexpectedly = !d.running && S.hotkey.running;
    const changed = S.hotkey.running !== d.running || !!S.hotkey.restore_pending !== !!d.restore_pending;
    S.hotkey.running = d.running;
    S.hotkey.restore_pending = !!d.restore_pending;
    if (changed) renderHotkeySection(S);
    if (stoppedUnexpectedly) pushStatus('err', S.strings.hotkey_state_stopped || 'Hotkey stopped unexpectedly');
  }
  if (!S.hotkey.running && !S.hotkey.restore_pending) stopHotkeyPolling();
}

function startCountdownIfNeeded() {
  stopCountdown();
  S.guardRemainingS = displayGuardRemainingS(S.guardRemainingS);
  if (S.guardRemainingS == null) return;
  if (S.guardRemainingS <= 0) {
    // Reopening the modal mid-retry (guard already expired server-side)
    // -- there is no local countdown left to run, so go straight to
    // polling instead of freezing on a stale "0s".
    startGuardPolling();
    return;
  }
  countdownTimer = setInterval(function () {
    if (S.guardRemainingS == null) { stopCountdown(); return; }
    S.guardRemainingS = displayGuardRemainingS(S.guardRemainingS);
    S.guardRemainingS = Math.max(0, S.guardRemainingS - 1);
    renderMonitorsModal();
    if (S.guardRemainingS <= 0) {
      stopCountdown();
      startGuardPolling();
    }
  }, 1000);
}

function renderMonitorsModal() {
  const body = el('qr-monitor-body');
  if (!body) return;
  body.innerHTML = '';

  const s = S.strings;
  const countEl = el('qr-monitor-count');
  if (countEl) countEl.textContent = (i18nFormat(s.monitors_detected_count, { count: S.monitors.length }) || S.monitors.length + ' detected');

  const pendingOutcomes = (S.pending.outcomes || []);
  if (pendingOutcomes.length > 0) {
    // This card used to gate solely on
    // S.guardRemainingS != null, which is only ever populated from a LIVE
    // in-process PendingDisableGuard (armed by a disable confirmed during
    // the current running session). A crash-recovered / boot-time pending
    // state (recover_on_boot's IN_FLIGHT or UNCONFIRMABLE branches) has no
    // such live guard -- self._pending_guard is None for that path -- so
    // guard_remaining_s is always null and the card, including Force
    // Unlock, never rendered, leaving the user with no way to release a
    // boot-armed lock short of editing pending_restore.json by hand. The
    // gate now keys off whether there is ANY actionable pending state
    // (outcomes present), which recover_on_boot's response and
    // recheck_pending's response both populate regardless of whether a
    // live guard exists. The countdown itself still only displays when
    // S.guardRemainingS is actually available (see below).
    const targetIds = pendingOutcomes.map(function (o) { return o.instance_id; });
    const names = pendingOutcomes.map(function (o) { return o.friendly_name; }).join(', ');
    const card = document.createElement('div');
    card.className = 'qr-revert';
    card.dataset.targets = targetIds.join(',');

    const head = document.createElement('div');
    head.className = 'qr-revert-head';
    const title = document.createElement('span');
    title.className = 'qr-revert-title';
    const revertTitle = s.revert_dialog_title || 'Keep this monitor disabled?';
    title.textContent = names ? (names + ' — ' + revertTitle) : revertTitle;
    const countdown = document.createElement('span');
    countdown.className = 'qr-revert-countdown';
    countdown.id = 'qr-revert-countdown';
    // No live guard (boot/crash-recovered state) means no real countdown to
    // show -- hide the pill instead of rendering a stale/nonsensical value.
    const displayRemainingS = displayGuardRemainingS(S.guardRemainingS);
    countdown.hidden = displayRemainingS == null;
    countdown.textContent = displayRemainingS != null ? displayRemainingS + 's' : '';
    head.appendChild(title);
    head.appendChild(countdown);

    const note = document.createElement('p');
    note.className = 'qr-revert-note';
    note.textContent = s.revert_note || 'If you do nothing, QuickRes re-enables it automatically. Use this if your screen went black.';

    card.appendChild(head);
    card.appendChild(note);

    // A target still resolved as IN_FLIGHT means its record's owner
    // process is gone but the independent elevated helper's liveness could
    // not be confirmed dead -- bridge.py's own keep_disabled/revert_now
    // refuse to act on it right now (they'd raise, though the app itself
    // stays safe either way -- see bridge.py's _InFlightStillPending).
    // Hiding the buttons here keeps the user from hitting that rejection
    // in the first place, matching how Force Unlock below is already
    // gated on force_unlockable rather than offered and then refused.
    const hasInFlight = pendingOutcomes.some(function (o) { return o.resolution === 'in_flight'; });
    if (!hasInFlight) {
      const actions = document.createElement('div');
      actions.className = 'qr-revert-actions';
      const keep = document.createElement('button');
      keep.type = 'button';
      keep.className = 'qr-revert-keep';
      keep.id = 'qr-notice-keep';
      keep.textContent = s.btn_keep_disabled || 'Keep disabled';
      const now = document.createElement('button');
      now.type = 'button';
      now.className = 'qr-revert-now';
      now.id = 'qr-notice-revert';
      now.textContent = s.btn_revert_now || 'Revert now';
      actions.appendChild(keep);
      actions.appendChild(now);
      card.appendChild(actions);
    }

    if (S.pending.force_unlockable) {
      const force = document.createElement('button');
      force.type = 'button';
      force.className = 'qr-revert-force';
      force.id = 'qr-notice-force-unlock';
      force.textContent = s.btn_force_unlock || 'Force unlock';
      card.appendChild(force);
    }

    body.appendChild(card);
  }

  S.monitors.forEach(function (m) {
    const row = document.createElement('div');
    row.className = 'qr-monitor-row';

    const head = document.createElement('div');
    head.className = 'qr-monitor-row-head';

    const name = document.createElement('span');
    name.className = 'qr-monitor-name';
    name.textContent = m.friendly_name;
    const detail = document.createElement('span');
    detail.className = 'qr-monitor-detail';
    detail.textContent = m.instance_id;
    head.appendChild(name);
    head.appendChild(detail);

    const foot = document.createElement('div');
    foot.className = 'qr-monitor-row-foot';

    const badge = document.createElement('span');
    cls(badge, 'qr-monitor-badge', m.enabled ? 'qr-monitor-badge-on' : '');
    badge.textContent = m.enabled ? (s.monitor_status_enabled || 'Enabled') : (s.monitor_status_disabled || 'Disabled');

    const action = document.createElement('button');
    action.type = 'button';
    cls(action, 'qr-monitor-action', m.enabled ? 'qr-monitor-action-disable' : '');
    action.dataset.instanceId = m.instance_id;
    action.dataset.enable = m.enabled ? '0' : '1';
    action.textContent = m.enabled ? (s.btn_disable || 'Disable') : (s.btn_enable || 'Enable');

    foot.appendChild(badge);
    foot.appendChild(action);
    row.appendChild(head);
    row.appendChild(foot);
    body.appendChild(row);
  });

  const disableAll = document.createElement('button');
  disableAll.type = 'button';
  disableAll.className = 'qr-btn';
  disableAll.id = 'qr-monitors-disable-all';
  disableAll.textContent = s.btn_disable_all || 'Disable all';
  body.appendChild(disableAll);
}

function isUpdateBusy(status) {
  return ['downloading', 'verifying', 'ready', 'installing'].indexOf((status || {}).stage) !== -1;
}

function updateProgressPercent(status) {
  if (status && status.percentage != null && Number.isFinite(Number(status.percentage))) {
    return Math.max(0, Math.min(100, Math.round(Number(status.percentage))));
  }
  const total = Number(status && status.total_bytes);
  const downloaded = Number(status && status.downloaded_bytes) || 0;
  if (!Number.isFinite(total) || total <= 0) return null;
  return Math.max(0, Math.min(100, Math.round((downloaded / total) * 100)));
}

function formatUpdateSize(bytes) {
  const value = Number(bytes);
  if (!Number.isFinite(value) || value < 0) return '';
  if (value < 1024 * 1024) return Math.round(value / 1024) + ' KB';
  return (value / (1024 * 1024)).toFixed(1) + ' MB';
}

function updateStatusText(status) {
  const s = S.strings;
  if (S.updateInfo && S.updateInfo.migration_required) {
    return uiText(S, 'Install QuickRes with the new installer, or extract the complete portable ZIP, to enable updates.', 'Для обновлений установите QuickRes новым установщиком или распакуйте полный portable ZIP.');
  }
  const stage = (status || {}).stage;
  const percent = updateProgressPercent(status);
  if (stage === 'downloading') {
    return percent == null
      ? (s.update_downloading_unknown || 'Downloading update…')
      : (i18nFormat(s.update_downloading, { percent: percent }) || ('Downloading update… ' + percent + '%'));
  }
  if (stage === 'verifying') return s.update_verifying || 'Verifying update…';
  if (stage === 'ready') return s.update_ready || 'Update downloaded. Restarting to install…';
  if (stage === 'installing') return s.update_installing || 'Restarting to install the update…';
  if (stage === 'failed') return (status && status.error) || s.update_failed || 'Could not download the update.';
  return i18nFormat(s.update_available_body, { version: (S.updateInfo && S.updateInfo.version) || '' })
    || ('QuickRes ' + ((S.updateInfo && S.updateInfo.version) || '') + ' is ready to install.');
}

function renderUpdateModalStatus() {
  if (S.modal !== 'update') return;
  const status = S.updateStatus || {};
  const busy = isUpdateBusy(status);
  const failed = status.stage === 'failed';
  const note = el('qr-update-status');
  const progress = el('qr-update-progress');
  const progressValue = el('qr-update-progress-value');
  const progressMeta = el('qr-update-progress-meta');
  const later = el('qr-update-later');
  const now = el('qr-update-now');
  const retry = el('qr-update-retry');
  const close = el('qr-modal-close');
  const percent = updateProgressPercent(status);

  if (note) note.textContent = updateStatusText(status);
  if (progress) progress.hidden = !busy;
  if (progressValue) {
    progressValue.style.width = percent == null ? '38%' : percent + '%';
    progressValue.parentElement.classList.toggle('qr-update-progress-indeterminate', busy && percent == null);
    if (percent == null) progressValue.parentElement.removeAttribute('aria-valuenow');
    else progressValue.parentElement.setAttribute('aria-valuenow', String(percent));
  }
  if (progressMeta) {
    progressMeta.hidden = !busy;
    if (status.total_bytes) {
      progressMeta.textContent = formatUpdateSize(status.downloaded_bytes) + ' / ' + formatUpdateSize(status.total_bytes);
    } else {
      progressMeta.textContent = status.downloaded_bytes ? formatUpdateSize(status.downloaded_bytes) : '';
    }
  }
  if (later) later.hidden = busy;
  if (now) now.hidden = busy || failed || !!(S.updateInfo && S.updateInfo.migration_required);
  if (retry) retry.hidden = !failed;
  if (close) close.hidden = busy;
}

function updateModalMarkup(info) {
  const modal = document.createElement('div');
  modal.className = 'qr-modal';
  const s = S.strings;
  const built = buildModalHead(info && info.migration_required
    ? uiText(S, 'Update installation required', 'Нужна установка обновления')
    : (s.update_available_title || 'Update available'));
  built.head.appendChild(built.close);
  const body = document.createElement('div');
  body.className = 'qr-modal-body';

  const note = document.createElement('p');
  note.className = 'qr-revert-note';
  note.id = 'qr-update-status';
  note.setAttribute('role', 'status');
  note.setAttribute('aria-live', 'polite');

  const progress = document.createElement('div');
  progress.id = 'qr-update-progress';
  progress.className = 'qr-update-progress';
  progress.setAttribute('role', 'progressbar');
  progress.setAttribute('aria-label', s.update_downloading_unknown || 'Downloading update');
  progress.setAttribute('aria-valuemin', '0');
  progress.setAttribute('aria-valuemax', '100');
  const progressValue = document.createElement('div');
  progressValue.id = 'qr-update-progress-value';
  progressValue.className = 'qr-update-progress-value';
  progress.appendChild(progressValue);

  const progressMeta = document.createElement('div');
  progressMeta.id = 'qr-update-progress-meta';
  progressMeta.className = 'qr-update-progress-meta';

  const actions = document.createElement('div');
  actions.className = 'qr-revert-actions';
  const later = document.createElement('button');
  later.type = 'button';
  later.id = 'qr-update-later';
  later.className = 'qr-revert-keep';
  later.textContent = s.btn_later || 'Later';
  const now = document.createElement('button');
  now.type = 'button';
  now.id = 'qr-update-now';
  now.className = 'qr-revert-now';
  now.textContent = s.btn_update_now || 'Update Now';
  const retry = document.createElement('button');
  retry.type = 'button';
  retry.id = 'qr-update-retry';
  retry.className = 'qr-revert-now';
  retry.textContent = s.btn_retry_download || 'Retry download';
  actions.appendChild(later);
  actions.appendChild(now);
  actions.appendChild(retry);
  if (info && info.migration_required) {
    const installer = document.createElement('button');
    installer.type = 'button';
    installer.className = 'qr-revert-now';
    installer.dataset.external = info.installer_url;
    installer.textContent = uiText(S, 'Open downloads', 'Открыть загрузки');
    actions.appendChild(installer);
  }

  body.appendChild(note);
  body.appendChild(progress);
  body.appendChild(progressMeta);
  body.appendChild(actions);
  modal.appendChild(built.head);
  modal.appendChild(body);
  return modal;
}

function i18nFormat(template, values) {
  if (!template) return null;
  return template.replace(/\{(\w+)\}/g, function (_, k) { return values[k] != null ? values[k] : ''; });
}

function openModal(kind) {
  // Only 'faq', 'monitors', and 'update' are ever passed as `kind` here. The
  // resolution-not-found dialog is a distinct S.modal value, but it is built
  // entirely by openVendorDialog() below, which sets S.modal/backdrop/markup
  // itself and never routes through this function at all -- so openModal
  // intentionally has no branch for that dialog kind.
  const overlays = el('qr-overlays');
  overlays.innerHTML = '';
  S.modal = kind;
  const backdrop = document.createElement('div');
  backdrop.className = 'qr-overlay';

  if (kind === 'faq') {
    backdrop.appendChild(faqModalMarkup());
    overlays.appendChild(backdrop);
    renderFaqList();
  } else if (kind === 'monitors') {
    backdrop.appendChild(monitorsModalMarkup());
    overlays.appendChild(backdrop);
    renderMonitorsModal();
    seedGuardAndTick();
  } else if (kind === 'update') {
    backdrop.appendChild(updateModalMarkup(S.updateInfo));
    overlays.appendChild(backdrop);
    renderUpdateModalStatus();
  }
}

function stopUpdatePolling() {
  if (updatePollTimer !== null) {
    clearInterval(updatePollTimer);
    updatePollTimer = null;
  }
}

async function pollUpdateStatus() {
  if (updatePollInFlight) return;
  updatePollInFlight = true;
  try {
    const status = await call('get_update_status');
    if (!status) return;
    S.updateStatus = status;
    renderUpdateModalStatus();

    if (status.stage === 'ready' && !updateInstallStarted) {
      // The verified file is now on disk. Show this state before the bridge
      // performs its monitor/hotkey safety hand-off and exits into the
      // rollback-capable replacement batch.
      updateInstallStarted = true;
      stopUpdatePolling();
      S.updateStatus = Object.assign({}, status, { stage: 'installing' });
      renderUpdateModalStatus();
      const installed = await call('install_downloaded_update');
      // Successful installation exits the process. Returning means the
      // hand-off or replacement launch failed, so make retry explicit.
      if (installed !== undefined) {
        updateInstallStarted = false;
        S.updateStatus = {
          stage: 'failed', downloaded_bytes: status.downloaded_bytes,
          total_bytes: status.total_bytes,
          error: S.strings.update_failed || 'Could not start the update installation.',
        };
        renderUpdateModalStatus();
      }
      return;
    }

    if (status.stage === 'failed' || status.stage === 'idle') stopUpdatePolling();
  } finally {
    updatePollInFlight = false;
  }
}

function startUpdatePolling() {
  stopUpdatePolling();
  pollUpdateStatus();
  updatePollTimer = setInterval(pollUpdateStatus, UPDATE_POLL_MS);
}

async function startUpdateDownload() {
  if (!S.updateInfo || !S.updateInfo.download_url) return;
  updateInstallStarted = false;
  const status = await call('start_update', S.updateInfo.download_url, S.updateInfo);
  if (!status) return;
  S.updateStatus = status;
  renderUpdateModalStatus();
  startUpdatePolling();
}

async function seedGuardAndTick() {
  const d = await call('recheck_pending');
  if (d) {
    S.pending = { outcomes: d.outcomes, force_unlockable: d.force_unlockable };
    S.guardRemainingS = displayGuardRemainingS(d.guard_remaining_s);
    renderNoticeSection(S);
    renderMonitorsModal();
    startCountdownIfNeeded();
  }
}

function closeOverlay() {
  // The countdown/guard-poll timers track the pending-record state, not
  // this overlay's own DOM lifecycle -- they can be running because the
  // Monitors modal seeded them (seedGuardAndTick/startCountdownIfNeeded) or
  // because boot() started them independently at the top level for a
  // globally-unresolved crash-recovered pending state, before any modal was
  // ever opened. Closing an unrelated modal (FAQ, Updates) used to stop
  // both timers unconditionally, freezing the notice banner from ever
  // updating again even though the pending state they track has nothing to
  // do with the modal being closed. Only the Monitors modal's own close
  // should stop them.
  const wasMonitorsModal = S.modal === 'monitors';
  el('qr-overlays').innerHTML = '';
  S.modal = null;
  if (wasMonitorsModal) {
    stopCountdown();
    stopGuardPolling();
  }
}

async function refreshMonitorsAfterMutation() {
  const m = await call('list_monitors');
  if (m) S.monitors = m;
  await seedGuardAndTick();
}

// Mirrors monitors.py's OUTCOME_GENUINE_FAILURE = "genuine_failure" outcome
// kind string -- kept in sync manually since it crosses the JS bridge as a
// plain JSON string inside each set_monitors_enabled result tuple
// (instance_id, ok, message, kind).
const OUTCOME_GENUINE_FAILURE = 'genuine_failure';

// set_monitors_enabled's
// bridge_op envelope is ok:true even when individual targets genuinely
// failed (e.g. a declined UAC prompt) -- that per-target outcome only
// lives in d.results and used to be discarded entirely by both call sites
// below, leaving a genuinely-failed enable/disable with zero user-facing
// feedback. Toasts every target whose outcome is a genuine failure,
// identifying it by friendly name when known, listing each with its own
// message so a partially-failed batch clearly shows which targets failed.
function surfaceMonitorEnableFailures(results) {
  if (!Array.isArray(results)) return;
  const failed = results.filter(function (r) {
    return r[1] === false || r[3] === OUTCOME_GENUINE_FAILURE;
  });
  if (!failed.length) return;
  const detail = failed.map(function (r) {
    const monitor = S.monitors.find(function (m) { return m.instance_id === r[0]; });
    const label = monitor ? monitor.friendly_name : r[0];
    return label + ': ' + r[2];
  }).join(' | ');
  pushStatus('err', detail);
}

async function resetPendingState(outcomes, refetchMonitors) {
  S.pending = { outcomes: outcomes, force_unlockable: false };
  S.guardRemainingS = null;
  stopCountdown();
  stopGuardPolling();
  renderNoticeSection(S);
  if (refetchMonitors) {
    const m = await call('list_monitors');
    if (m) S.monitors = m;
  }
  renderMonitorsModal();
}

// keep_disabled()/revert_now() resolve only the ONE target their own live
// guard (or, for the boot/crash-recovered path, the on-disk record) is
// actually scoped to -- see bridge.py's per-target trimming. The on-disk
// pending record is a union across possibly multiple disable batches
// though (_build_and_save_pending_record), so a notice card can list a
// sibling target that this click never touched and that is still
// genuinely pending afterwards. Assuming the whole record is settled and
// hardcoding an empty outcome list here would silently drop that sibling's
// banner and stop the guard poll that would otherwise surface its eventual
// resolution. This re-queries the server for the actual current pending
// state -- the same
// call seedGuardAndTick uses -- and restarts polling if anything is still
// unresolved, instead of assuming the outcome.
async function refreshPendingAfterResolution(refetchMonitors) {
  if (refetchMonitors) {
    const m = await call('list_monitors');
    if (m) S.monitors = m;
  }
  const d = await call('recheck_pending');
  S.pending = d ? { outcomes: d.outcomes, force_unlockable: d.force_unlockable } : { outcomes: [], force_unlockable: false };
  S.guardRemainingS = d ? displayGuardRemainingS(d.guard_remaining_s) : null;
  stopCountdown();
  if (guardStillUnresolved()) {
    startGuardPolling();
  } else {
    stopGuardPolling();
  }
  renderNoticeSection(S);
  renderMonitorsModal();
}

function openVendorDialog(vendors, width, height) {
  const overlays = el('qr-overlays');
  overlays.innerHTML = '';
  S.modal = 'notfound';
  const backdrop = document.createElement('div');
  backdrop.className = 'qr-overlay qr-overlay-center';
  const dialog = document.createElement('div');
  dialog.className = 'qr-dialog';

  const title = document.createElement('div');
  title.className = 'qr-dialog-title';
  const dot = document.createElement('span');
  dot.className = 'qr-dialog-dot';
  const s = S.strings;
  const titleText = document.createElement('span');
  titleText.textContent = (s.dialog_res_not_found_title || 'Resolution not found') + ': ' + width + 'x' + height;
  title.appendChild(dot);
  title.appendChild(titleText);
  dialog.appendChild(title);

  const DRIVER_LABELS = { nvidia: s.btn_nvidia_panel, amd: s.btn_amd_software, intel: s.btn_intel_graphics };
  vendors.forEach(function (vendor) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'qr-driver-btn';
    btn.dataset.vendor = vendor;
    btn.textContent = DRIVER_LABELS[vendor] || ('Open ' + vendor.toUpperCase() + ' driver panel');
    dialog.appendChild(btn);
  });

  const cancel = document.createElement('button');
  cancel.type = 'button';
  cancel.id = 'qr-vendor-cancel';
  cancel.className = 'qr-dialog-cancel';
  cancel.textContent = s.btn_cancel || 'Cancel';
  dialog.appendChild(cancel);

  backdrop.appendChild(dialog);
  overlays.appendChild(backdrop);
}

/* Shared by the preset-click and custom-resolution Apply handlers: both call
   pick_resolution the same way and must react to its data shape identically.
   `d` is call()'s already-unwrapped `data` field, i.e. pick_resolution's own
   {ok, reason, message} return value (not the outer bridge_op envelope --
   call() already toasts and returns null for an envelope-level failure, so a
   null/undefined `d` here means that already happened and there is nothing
   left to do). d.ok === false with reason 'unsupported' means the requested
   mode isn't in the display's supported list, so the vendor-driver-panel
   dialog is the correct next step. Any OTHER d.ok === false (reason is null)
   is a genuine failure from the underlying Win32 mode-change call itself --
   surfaced as an error toast instead of being silently discarded. */
function handlePickResolutionResult(d, width, height) {
  if (!d) return;
  if (d.ok === true) { refreshResolutionState(); return; }
  if (d.reason === 'unsupported') { openVendorDialog(d.vendors, width, height); return; }
  pushStatus('err', d.message || 'Unexpected failure');
}

/* ==S7 EVENTS== */
/* Shared by every click handler below: opens the clicked element's
   data-external URL via the bridge and reports whether it handled the
   click, so callers can `return` early on a hit. */
async function openExternalLinkIfClicked(e) {
  const ext = e.target.closest('[data-external]');
  if (!ext) return false;
  await call('open_external', ext.dataset.external);
  return true;
}

el('qr-titlebar').addEventListener('click', async function (e) {
  if (await openExternalLinkIfClicked(e)) return;
  if (e.target.id === 'qr-theme-toggle') {
    const nextTheme = S.theme === 'dark' ? 'light' : 'dark';
    const d = await call('set_theme', nextTheme);
    if (d) { S.theme = d.theme; renderTitlebar(S); }
  }
});

el('qr-lang-select').addEventListener('change', async function (e) {
  const d = await call('set_language', e.target.value);
  if (d) {
    S.language = d.language;
    S.strings = d.strings;
    S.faq = d.faq.map(function (item) { return { q: item.q, a: item.a, open: false }; });
    renderAll(S);
    if (S.modal === 'faq') renderFaqList();
    if (S.modal === 'monitors') renderMonitorsModal();
  }
});

el('qr-res-search').addEventListener('input', function (e) {
  S.resolutionQuery = e.target.value;
  renderPresetCards(S);
});

el('qr-panel').addEventListener('change', function (e) {
  const fields = { 'qr-hotkey-key': 'key', 'qr-hotkey-native': 'native_res', 'qr-hotkey-stretched': 'stretched_res' };
  const field = fields[e.target.id];
  if (field) {
    S.hotkeyDraft = Object.assign({}, S.hotkeyDraft || S.hotkey);
    S.hotkeyDraft[field] = e.target.value;
    el('qr-hotkey-summary').textContent = S.hotkey.running ? S.hotkey.key : S.hotkeyDraft.key;
  }
});

el('qr-panel').addEventListener('click', async function (e) {
  const sectionToggle = e.target.closest('[data-section]');
  if (sectionToggle) {
    const section = sectionToggle.dataset.section;
    const collapsed = preferencesFor(S).collapsed_sections;
    S.uiPreferences.collapsed_sections = collapsed.includes(section)
      ? collapsed.filter(function (value) { return value !== section; }) : collapsed.concat(section);
    renderSectionStates(S);
    await saveUiPreferences();
    return;
  }
  const favorite = e.target.closest('[data-favorite]');
  if (favorite) {
    const value = favorite.dataset.favorite;
    const favorites = preferencesFor(S).favorite_resolutions;
    S.uiPreferences.favorite_resolutions = favorites.includes(value)
      ? favorites.filter(function (item) { return item !== value; }) : favorites.concat(value);
    renderPresetCards(S);
    await saveUiPreferences();
    return;
  }

  if (e.target.id === 'qr-boot-retry') {
    await boot();
    return;
  }

  const presetBtn = e.target.closest('.qr-res-preset');
  if (presetBtn) {
    const width = parseInt(presetBtn.dataset.width, 10);
    const height = parseInt(presetBtn.dataset.height, 10);
    const d = await call('pick_resolution', width, height);
    handlePickResolutionResult(d, width, height);
    return;
  }

  if (e.target.id === 'qr-custom-apply') {
    // No dedicated bridge method exists for the custom-resolution input, so
    // parse the "WxH" text client-side and call the same pick_resolution a
    // preset click uses, reusing its unsupported-resolution vendor dialog
    // verbatim.
    // Must be kept char-for-char in sync with bridge.py's _RES_TEXT_RE --
    // bridge.py is the server-side source of truth that ultimately decides
    // WxH validity (pick_resolution's _coerce_wh re-validates any string
    // input), so a drift here would let the UI accept text the backend
    // rejects (or vice versa). No /i flag: _RES_TEXT_RE has no
    // re.IGNORECASE, so uppercase 'X' is intentionally NOT accepted.
    const CUSTOM_RE = /^(\d{2,5})\s*[x, ]\s*(\d{2,5})$/;
    const m = CUSTOM_RE.exec(el('qr-custom-input').value.trim());
    if (!m) { pushStatus('err', S.strings.custom_res_placeholder || 'e.g. 1440x1080'); return; }
    const width = parseInt(m[1], 10), height = parseInt(m[2], 10);
    const d = await call('pick_resolution', width, height);
    handlePickResolutionResult(d, width, height);
    return;
  }

  if (e.target.id === 'qr-hotkey-start') {
    const profile = {
      key: el('qr-hotkey-key').value,
      native_res: el('qr-hotkey-native').value,
      stretched_res: el('qr-hotkey-stretched').value,
    };
    const d = await call('start_hotkey', profile.key, profile.native_res, profile.stretched_res);
    if (d) {
      Object.assign(S.hotkey, profile, { running: d.running, restore_pending: false });
      S.hotkeyDraft = null;
      renderHotkeySection(S);
      startHotkeyPolling();
    }
    return;
  }

  if (e.target.id === 'qr-hotkey-stop') {
    const d = await call('stop_hotkey');
    if (d) {
      S.hotkey.running = d.running;
      S.hotkey.restore_pending = false;
      renderHotkeySection(S);
      stopHotkeyPolling();
    } else {
      startHotkeyPolling();
    }
    return;
  }

  if (e.target.closest('#qr-notice-banner')) {
    const m = await call('list_monitors');
    if (m) S.monitors = m;
    openModal('monitors');
    return;
  }
});

el('qr-actionbar').addEventListener('click', async function (e) {
  if (e.target.id === 'qr-open-faq') { openModal('faq'); return; }
  if (e.target.id === 'qr-open-monitors') {
    const m = await call('list_monitors');
    if (m) S.monitors = m;
    openModal('monitors');
    return;
  }
  if (e.target.id === 'qr-check-updates') {
    // Do not start a second version check/download on a rapid second click.
    // The existing job is authoritative and can simply be shown again.
    if (isUpdateBusy(S.updateStatus)) {
      openModal('update');
      startUpdatePolling();
      return;
    }
    const d = await call('check_updates');
    // The bridge-side check_updates() compares the fetched
    // version.json against the running version and includes an
    // update_available boolean -- a genuine update opens the confirm modal
    // (below) instead of just toasting, so the SHA-256-gated
    // download/verify/apply pipeline (confirm_update) actually gets a UI
    // trigger. No update keeps the prior toast.
    if (d && (d.update_available || d.migration_required)) {
      S.updateInfo = d;
      S.updateStatus = { stage: 'idle', downloaded_bytes: 0, total_bytes: null, error: null };
      openModal('update');
    } else if (d) {
      pushStatus('ok', 'You are on the latest version (' + (d.version || '') + ')');
    }
    return;
  }
  if (await openExternalLinkIfClicked(e)) return;
});

el('qr-overlays').addEventListener('click', async function (e) {
  if (await openExternalLinkIfClicked(e)) return;
  if (e.target.id === 'qr-modal-close' || e.target.id === 'qr-vendor-cancel' || e.target.id === 'qr-update-later') {
    closeOverlay();
    return;
  }

  if (e.target.id === 'qr-update-now' || e.target.id === 'qr-update-retry') {
    await startUpdateDownload();
    return;
  }

  const faqQ = e.target.closest('.qr-faq-q');
  if (faqQ) {
    const idx = parseInt(faqQ.parentElement.dataset.index, 10);
    S.faq = S.faq.map(function (item, i) { return i === idx ? Object.assign({}, item, { open: !item.open }) : item; });
    renderFaqList();
    return;
  }

  const monitorBtn = e.target.closest('[data-instance-id]');
  if (monitorBtn) {
    const enable = monitorBtn.dataset.enable === '1';
    const d = await call('set_monitors_enabled', [monitorBtn.dataset.instanceId], enable);
    if (d) {
      surfaceMonitorEnableFailures(d.results);
      await refreshMonitorsAfterMutation();
    }
    return;
  }

  if (e.target.id === 'qr-monitors-disable-all') {
    const ids = S.monitors.filter(function (m) { return m.enabled; }).map(function (m) { return m.instance_id; });
    const d = await call('set_monitors_enabled', ids, false);
    if (d) {
      surfaceMonitorEnableFailures(d.results);
      await refreshMonitorsAfterMutation();
    }
    return;
  }

  if (e.target.id === 'qr-notice-keep') {
    const d = await call('keep_disabled');
    if (d) await refreshPendingAfterResolution(false);
    return;
  }

  if (e.target.id === 'qr-notice-revert') {
    const d = await call('revert_now');
    if (d) await refreshPendingAfterResolution(true);
    return;
  }

  if (e.target.id === 'qr-notice-force-unlock') {
    const d = await call('force_unlock_pending');
    if (d) await resetPendingState(d.outcomes, false);
    return;
  }

  const driverBtn = e.target.closest('[data-vendor]');
  if (driverBtn) {
    await call('open_driver_panel', driverBtn.dataset.vendor);
    return;
  }
});

window.onerror = function (message) {
  pushStatus('err', String(message), { persist: true });
};

window.onunhandledrejection = function (event) {
  const reason = event && event.reason;
  pushStatus('err', (reason && reason.message) || String(reason), { persist: true });
};

/* ==S8 HOTKEY DEFAULTS== */
function applyHotkeyDefaults(state) {
  if (!state.hotkey.native_res) {
    if (state.currentResolution) {
      state.hotkey.native_res = state.currentResolution.width + 'x' + state.currentResolution.height;
    } else if (state.presets.length) {
      state.hotkey.native_res = state.presets[0].width + 'x' + state.presets[0].height;
    }
  }
  if (!state.hotkey.stretched_res) {
    const stretched = state.presets.find(function (p) { return p.kind === 'stretched'; });
    const fallback = stretched || state.presets[1];
    if (fallback) state.hotkey.stretched_res = fallback.width + 'x' + fallback.height;
  }
}

/* ==S9 BOOT== */
function showBootError() {
  cls(el('qr-boot-error'), 'qr-boot-error', 'qr-boot-error-visible');
}

function hideBootError() {
  cls(el('qr-boot-error'), 'qr-boot-error');
}

async function boot() {
  const initial = await call('get_initial_state');
  if (!initial) { showBootError(); return; }
  hideBootError();
  S.theme = initial.theme;
  S.version = initial.version;
  S.language = initial.language;
  S.strings = initial.strings;
  S.currentResolution = initial.current_resolution;
  S.presets = initial.presets;
  S.uiPreferences = initial.ui_preferences || { collapsed_sections: [], favorite_resolutions: [] };
  S.hotkey = initial.hotkey;
  S.monitors = initial.monitors;
  S.pending = initial.pending;
  S.faq = initial.faq.map(function (item) { return { q: item.q, a: item.a, open: false }; });
  applyHotkeyDefaults(S);
  renderAll(S);
  startResolutionPolling();
  startHotkeyPolling();
  // A boot/crash-recovered pending record has no live guard, so
  // S.guardRemainingS stays null and startCountdownIfNeeded()'s early
  // return is never reached from here -- polling used to only ever start
  // once the user opened the Monitors modal. Checking the same
  // guardStillUnresolved() condition startGuardPolling() itself already
  // uses lets an unresolved outcome (still IN_FLIGHT, or otherwise not yet
  // force-unlockable) start being watched immediately on boot, so the
  // notice banner and modal update themselves as the recovery settles
  // instead of requiring the user to keep closing and reopening the modal.
  if (guardStillUnresolved()) startGuardPolling();
}

window.addEventListener('focus', refreshResolutionState);
if (document.addEventListener) {
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) refreshResolutionState();
  });
}

if (window.pywebview) { boot(); } else { window.addEventListener('pywebviewready', boot); }
</script>
</body></html>
